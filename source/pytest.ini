[pytest]
testpaths = tests
markers =
    unit: fast isolated tests for one function or option registry behavior
    behavior: executable regression tests that validate application behavior
    contract: source, documentation, packaging, and release-content contracts
    gui: tests that require Tkinter and a usable graphical display
    integration: multi-module filesystem or workflow scenarios
    slow: tests intentionally excluded from the fastest developer loop
addopts = -ra
